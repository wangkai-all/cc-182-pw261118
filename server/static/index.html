<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>入仓台 · 批次校验与发布</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">仓</span>
      <div>
        <strong>入仓台</strong>
        <small>批次校验与发布</small>
      </div>
    </div>

    <button class="btn btn-primary btn-block" data-action="new-batch">
      <span aria-hidden="true">＋</span> 新建批次
    </button>

    <nav class="nav" aria-label="主视图">
      <button class="nav-item is-active" data-action="view" data-view="upload">批处理</button>
      <button class="nav-item" data-action="view" data-view="query">对外查询</button>
    </nav>

    <div class="sidebar-section">
      <div class="sidebar-label">批次</div>
      <div id="batch-list" class="batch-list" aria-live="polite"></div>
    </div>

    <div class="sidebar-section samples">
      <div class="sidebar-label">本地样例</div>
      <button class="sample-btn" data-action="load-sample" data-scenario="initial">
        <strong>混乱批次</strong>
        <small>循环到达 · 重复主键 · 金额超限</small>
      </button>
      <button class="sample-btn" data-action="load-sample" data-scenario="fixed">
        <strong>修复后批次</strong>
        <small>可直接封口发布的完整数据</small>
      </button>
      <button class="sample-btn" data-action="load-sample" data-scenario="next">
        <strong>下一批次</strong>
        <small>用于验证版本切换</small>
      </button>
    </div>

    <div class="sidebar-footer">
      <span class="dot dot-live" aria-hidden="true"></span>
      数据仅保存在本机 SQLite
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="page-title">批处理</h1>
        <p id="page-subtitle">按文件到达顺序暂存候选数据，封口后统一校验，全部通过才发布。</p>
      </div>
      <div class="topbar-meta" id="release-badge"></div>
    </header>

    <div id="global-banner"></div>
    <div id="main-content" class="content" aria-live="polite"></div>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

<script src="/app.js" type="module"></script>
</body>
</html>
